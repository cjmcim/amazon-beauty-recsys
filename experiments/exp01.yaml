# ============================================================
# exp01: 样本工程第一课 —— 加大 hard 负样本比例
# 只写要覆盖基线的参数，其余自动继承 config.yaml（deep_merge）
# ============================================================
rank:
  hard_neg_ratio: 5        # baseline 3 → 5：每个正样本配 5 个 hard 负样本（本次实验主角）
  num_boost_round: 300     # [教学加速] baseline 800：缩短训练时间，非对比项

spark:
  shuffle_partitions: 50   # [教学加速] baseline 100：只影响并行度，不影响业务语义
